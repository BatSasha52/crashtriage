[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashtriage"
version = "0.1.0"
description = "Triage crash logs with source context, git history and an LLM."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
crashtriage = "crashtriage.cli:main"

[tool.setuptools]
packages = ["crashtriage"]